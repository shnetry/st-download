<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ST Download - TikTok Downloader</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #0b0f19;
            color: #ffffff;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-4">

    <!-- Header / Navbar -->
    <header class="max-w-md mx-auto w-full flex justify-between items-center py-4 px-2">
        <div class="flex items-center space-x-2">
            <span class="bg-gradient-to-r from-pink-500 to-red-500 text-white font-black text-xl px-2.5 py-1 rounded-lg italic">ST</span>
            <span class="text-2xl font-bold tracking-wide">Download</span>
        </div>
        <button class="text-gray-300 text-2xl focus:outline-none">
            <i class="fa-solid fa-bars"></i>
        </button>
    </header>

    <!-- Main Content Container -->
    <main class="max-w-md mx-auto w-full space-y-6">

        <!-- Hero Section -->
        <div class="text-center space-y-2 mt-4">
            <h1 class="text-4xl font-extrabold tracking-tight">
                TikTok <span class="text-transparent bg-clip-text bg-gradient-to-r from-pink-500 to-rose-500">Downloader</span>
            </h1>
            <p class="text-gray-300 font-medium text-sm">Download TikTok videos without watermark</p>
            <div class="flex justify-center items-center space-x-2 text-xs text-gray-400 pt-1">
                <span>Fast</span>
                <span>•</span>
                <span>Free</span>
                <span>•</span>
                <span>High Quality</span>
            </div>
        </div>

        <!-- Input & Action Section -->
        <div class="space-y-3 pt-2">
            <div class="relative flex items-center">
                <i class="fa-solid fa-link absolute left-4 text-gray-400 text-lg"></i>
                <input type="text" placeholder="Paste TikTok video link here" 
                       class="w-full bg-[#161c2e] text-white placeholder-gray-400 rounded-xl py-3.5 pl-12 pr-10 border border-gray-700/60 focus:outline-none focus:border-pink-500 text-sm">
                <button class="absolute right-4 text-gray-400 hover:text-white">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>

            <button class="w-full bg-gradient-to-r from-pink-500 to-rose-600 hover:opacity-95 text-white font-bold py-3.5 rounded-xl flex items-center justify-center space-x-2 shadow-lg shadow-pink-500/20 text-base transition">
                <i class="fa-solid fa-download"></i>
                <span>Download</span>
            </button>
        </div>

        <!-- Mini Features Row -->
        <div class="grid grid-cols-4 gap-2 pt-4 text-center">
            <div class="flex flex-col items-center space-y-2">
                <div class="w-12 h-12 rounded-full border border-pink-500/40 flex items-center justify-center text-pink-500 text-lg">
                    <i class="fa-solid fa-ban"></i>
                </div>
                <span class="text-[11px] text-gray-300 font-medium leading-tight">No Watermark</span>
            </div>
            <div class="flex flex-col items-center space-y-2">
                <div class="w-12 h-12 rounded-full border border-yellow-500/40 flex items-center justify-center text-yellow-500 text-lg">
                    <i class="fa-solid fa-bolt"></i>
                </div>
                <span class="text-[11px] text-gray-300 font-medium leading-tight">Fast Download</span>
            </div>
            <div class="flex flex-col items-center space-y-2">
                <div class="w-12 h-12 rounded-full border border-blue-500/40 flex items-center justify-center text-blue-500 text-lg">
                    <i class="fa-solid fa-file-video"></i>
                </div>
                <span class="text-[11px] text-gray-300 font-medium leading-tight">HD Quality</span>
            </div>
            <div class="flex flex-col items-center space-y-2">
                <div class="w-12 h-12 rounded-full border border-emerald-500/40 flex items-center justify-center text-emerald-500 text-lg">
                    <i class="fa-solid fa-mobile-screen"></i>
                </div>
                <span class="text-[11px] text-gray-300 font-medium leading-tight">Works on All Devices</span>
            </div>
        </div>

        <!-- How to use Section -->
        <div class="pt-6 space-y-4">
            <h2 class="text-center text-lg font-bold">How to use?</h2>
            <div class="grid grid-cols-3 gap-3 text-center">
                <div class="flex flex-col items-center space-y-2">
                    <div class="w-9 h-9 bg-pink-600 rounded-full flex items-center justify-center text-white font-bold text-sm">1</div>
                    <i class="fa-solid fa-link text-gray-400 text-sm"></i>
                    <p class="text-xs text-gray-300 leading-snug">Copy TikTok link</p>
                </div>
                <div class="flex flex-col items-center space-y-2">
                    <div class="w-9 h-9 bg-pink-600 rounded-full flex items-center justify-center text-white font-bold text-sm">2</div>
                    <i class="fa-solid fa-paste text-gray-400 text-sm"></i>
                    <p class="text-xs text-gray-300 leading-snug">Paste the link above</p>
                </div>
                <div class="flex flex-col items-center space-y-2">
                    <div class="w-9 h-9 bg-pink-600 rounded-full flex items-center justify-center text-white font-bold text-sm">3</div>
                    <i class="fa-solid fa-download text-gray-400 text-sm"></i>
                    <p class="text-xs text-gray-300 leading-snug">Click Download and save</p>
                </div>
            </div>
        </div>

        <!-- Download Result Card (Hidden by default, used when video is ready) -->
        <div class="bg-[#131927] border border-gray-800 rounded-2xl p-4 space-y-3 mt-6">
            <div class="relative rounded-xl overflow-hidden aspect-square max-w-[200px] mx-auto">
                <img src="https://via.placeholder.com/300" alt="Result Thumbnail" class="w-full h-full object-cover">
                <div class="absolute inset-0 bg-black/30 flex items-center justify-center">
                    <i class="fa-solid fa-play text-white text-3xl opacity-80"></i>
                </div>
            </div>
            <div class="space-y-2">
                <button class="w-full bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-2.5 rounded-xl flex items-center justify-center space-x-2 text-sm transition">
                    <i class="fa-solid fa-download"></i>
                    <span>Download (No Watermark)</span>
                </button>
                <button class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 rounded-xl flex items-center justify-center space-x-2 text-sm transition">
                    <i class="fa-solid fa-download"></i>
                    <span>Download HD (No Watermark)</span>
                </button>
            </div>
        </div>

    </main>

    <footer class="text-center text-xs text-gray-500 py-6">
        © ST Download. All rights reserved.
    </footer>

</body>
</html>
